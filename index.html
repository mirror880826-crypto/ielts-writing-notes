<script id="notes-data" type="application/json">[{"id": "T2-HEALTH-001", "title": "高糖食品應該漲價嗎？", "enTitle": "The price of sugar", "date": "2026-10-19", "task": "Task 2", "type": "Agree / Disagree", "tags": ["健康", "飲食", "價格政策"], "prompt": "Many manufactured food and drink products contain high levels of sugar, which causes many health problems. Sugary products should be made more expensive to encourage people to consume less sugar.", "question": "Do you agree or disagree?", "instruction": "Give reasons for your answer and include any relevant examples from your own knowledge or experience. Write at least 250 words.", "originals": [{"name": "第一次作答", "paragraphs": ["Living in busy modern life, many people's daily diet have become increasingly rely on processed food and drinks because of their accessibility and low prices. However, most of the manufactured food and drinks share two common features, considerable amount of sugar and low level of other essential nutrients, such as proteins or vitamins. Consequently, some health experts propose that these sugary items need to be more expensive, so that people will eat and drink fewer of these products.", "From my perspective, the idea that people should consume less sugar is an absolutely great solution to public health, since high sugar diet is usually considered a leading cause of many chronic dieases. Even though it can offer people instant satisfaction and pleasure, it may bring various of threats to our body in the longterm. But would it be possible to make the public healthier by simply raising the price of processed food? My answer is no and I think this way of fixing problem is a totally misidentifying of the problem. The following is my opinion.", "Most people is not purchasing manufactured food because they like it, but because eating is necessary and these kind of items provide the cheapest and easiest way of eating, which means it may drive the poor into hunger if we just make these items more expensive unilatera  same sweet food to their kids since there's still no affordable whole food choice nearby. In this situation, people would spend more money without improving their diet.", "Furthermore, even when consumers switch products in response to higher prices, their overall diet may remain unhealthy. This is because people's underlying requirements for cheap and convenient food remains the same. For instance, people are highly likely to substitute the sweet biscuits with crisps which is cheap but highly salty and unhealthy to human's body. The potential health benefits producing by reducing sugar intake would therefore be limited if one unhealthy habit were simply replaced by another.", "In conclusion, I disapprove the proposal of making people healthier by generally raising the price of food and drinks with high level of sugar. And I would suggest we promoting health diet by focusing on making fresh or whole food more accessible, affordable and convenient."], "score": "6.0", "scores": [6, 7, 6, 5], "notes": ["立場一致，兩個理由都有發展；但公共健康危機與研究主張概括過強。", "四段功能與推論順序清楚，原因、例子、結果相互承接。", "有適合議論文的詞彙，但搭配、詞性及用詞精確度不穩。", "被動語態、完整句、主動詞一致與分詞錯誤反覆出現。"], "priorities": ["動詞結構與主動詞一致。", "讓主張強度符合例子能支持的程度。", "保留現有段落推進，不必再堆疊連接詞。"], "annotations": [{"id": "s01", "p": 1, "type": "修正", "category": "主詞與指代", "original": "In today's busy and highly industrialized society, a high proportion of people's daily meal rely on manufactured food and drinks that usually cotain excessive amounts of sugar, which has raised serious concerns among many experts regarding the public health problems it triggers.", "fixed": "In today's busy and highly industrialized society, a high proportion of people rely on manufactured food and drinks for their daily meals. These products usually contain excessive amounts of sugar, which has raised serious concerns among many experts regarding the public health problems that excessive sugar consumption can cause.", "why": ["依賴食品的是 people，不是 daily meals。改成 people rely on… for their daily meal  making fresh or whole food more accessible, affordable and convenient.", "why": ["suggest (that) we promote…，不能寫 suggest we promoting。另一種是 suggest promoting…。", "healthy 是形容詞；a healthy diet 中的單數 diet 需要冠詞。", "句首 And 並非文法錯誤。"], "optional": "Instead 可以更明確引入替代方案。more accessible, affordable and convenient 並列正確。", "logic": "最後決定使用 Our priority should be to…，不另引入 government，以免焦點轉移。"}], "final": ["Many manufactured foods and drinks contain excessive amounts of sugar, raising concerns about public health. Some therefore argue that these products should become more expensive to discourage consumption. Although higher prices may reduce sugar intake, I oppose a general increase because it could burden poorer households before they have realistic opportunities to change their diets.", "The main concern is that this policy could raise food costs without making healthier choices practical. Some families depend on inexpensive sugary products because their budgets and working hours limit their options. Admittedly, higher prices would make healthier alternatives relatively more attractive. However, these alternatives might still exceed the household budget. For example, parents might continue buying sweetened breakfast cereals if lower-sugar varieties remained more expensive and cooking breakfast was impractical. In such cases, higher prices could increase spending without changing consumption, placing a financial burden on families with limited alternatives.", "Furthermore, switching products would not guarantee better nutrition. Consumers seeking cheap, convenient snacks might replace sweet biscuits with crisps that contain less sugar but more salt. This would not eliminate the benefits of reducing sugar, but it could limit the improvement in their overall diets. Rather than assuming that consumers will make healthier choices once prices rise, policymakers should ensure that nutritious substitutes are affordable and readily available.", "In conclusion, although reducing sugar consumption is important, I disagree with a general price increase while affordable, healthier alternatives remain out of reach. Our priority should be to make these options more accessible, so that people can improve their diets without facing additional financial pressure."], "finalNotes": ["最後一次確認的版本，共 259 字。這是共同修改後的學習範文，不代表限時獨立作答能力。", "先前 261 字版本教學估分約 7.0–7.5（保守看 7.0）；此定稿其後再調整第二段例子，未另做完整四項評分。", "立場是：在可負擔的健康替代品仍難以取得時，反對普遍漲價；並非宣稱所有價格措施都無效。"], "logic": [{"title": "引入政策，再提出反對", "before": "由糖的健康風險直接跳到 Although increasing their prices…", "after": "先交代有人主張漲價以抑制消費，再表明立場。", "lesson": "橋接句要增加資訊，不是只補 Therefore。"}, {"title": "相對便宜，不等於實際負擔得起", "before": "漲價不會使健康食品變便宜。", "after": "承認健康選項相對更有吸引力，再指出價格仍可能超出家庭預算。", "lesson": "先回應對方最合理的反駁，再界定政策適用限制。"}, {"title": "用餐食情境取代甜飲例子", "before": "家長可能繼續買甜飲；但讀者可以問：為何不喝水？", "after": "改成含糖早餐穀片；條件是低糖版本仍更貴，而自行備餐不切實際。", "lesson": "例子必須交代為何不轉換。這是特定情境，不是所有家庭的必然結果。"}, {"title": "減糖有效，不代表整體飲食必然改善", "before": "換成洋芋片不健康，所以漲價無效。", "after": "可能少吃糖、卻多吃鹽；承認減糖好處，同時指出整體收益可能受限。", "lesson": "效果有限不等於完全無效；例子只能支持有限的結論。"}, {"title": "結論明確回到 disagree", "before": "I would prioritise… 表達優先順序，但不單獨等於反對。", "after": "I disagree with a general price increase while…，保留反對條件。", "lesson": "不強制重複 disagree，但在本篇明說能更直接呼應引言。"}, {"title": "建議聚焦方法，而非新主體", "before": "結尾另加入政府與健康教育，但主體段未充分發展。", "after": "Our priority should be to make these options more accessible…。", "lesson": "結論收束已發展的方案，不在最後開新論線。"}], "expressions": [{"id": "e01", "phrase": "Although A, B", "meaning": "承認一項好處，再提出主要立場。", "source": "Although higher prices may reduce sugar intake, I oppose a general increase…", "example": "Although online learning offers greater flexibility, classroom interaction remains valuable.", "use": "教育、科技、政策評估", "tip": "後文要解釋：既然有好處，為什麼仍支持或反對？"}, {"id": "e02", "phrase": "Admittedly, … However, …", "meaning": "先承認合理之處，再指出限制。", "source": "Admittedly, higher prices would make healthier alternatives relatively more attractive. However, these alternatives might still exceed the household budget.", "example": "Admittedly, private cars are convenient. However, widespread car use can worsen congestion.", "use": "交通、環境、政策評估", "tip": "However 後應回應前句的限制，不要突然換話題。"}, {"id": "e03", "phrase": "place a financial burden on…", "meaning": "增加……的經濟負擔。", "source": "…placing a financial burden on families with limited alternatives.", "example": "Higher tuition fees could place a financial burden on low-income students.", "use": "教育、住房、醫療", "tip": "句中以 placing… 補充前述結果；也可寫成完整子句。"}, {"id": "e04", "phrase": "remain out of reach", "meaning": "仍然難以取得或負擔。", "source": "…while affordable, healthier alternatives remain out of reach.", "example": "For some young adults, home ownership remains out of reach.", "use": "住房、教育、資源分配", "tip": "用上下文交代是價格障礙，還是取得管道的限制。"}, {"id": "e05", "phrase": "Our priority should be to…", "meaning": "我們應優先做的是……。", "source": "Our priority should be to make these options more accessible…", "example": "Our priority should be to improve the reliability of public transport.", "use": "各類對策與結論", "tip": "to 後接動詞原形；方案需要有前文支持。"}, {"id": "e06", "phrase": "rather than + V-ing / 名詞", "meaning": "而不是……；比較做法。", "source": "Rather than assuming that consumers will make healthier choices once prices rise…", "example": "Rather than building more roads, cities could invest in public transport.", "use": "交通、教育、環境", "tip": "確保比較的內容在文法與邏輯上相互對應。"}, {"id": "e07", "phrase": "This would not eliminate…, but it could limit…", "meaning": "不否定一項好處，同時指出限制。", "source": "This would not eliminate the benefits of reducing sugar, but it could limit the improvement in their overall diets.", "example": "This would not eliminate the benefits of tourism, but it could limit its contribution to local employment.", "use": "政策、經濟、觀光", "tip": "強度符合證據；有局限不等於完全無效。"}, {"id": "e08", "phrase": "so that + 主詞 + can…", "meaning": "說明措施的目的或預期效果。", "source": "…so that people can improve their diets without facing additional financial pressure.", "example": "Schools should provide clear feedback so that students can identify their weaknesses.", "use": "教育、職場、公共服務", "tip": "說清楚怎麼幫助人們，而不只寫籠統的 positive effects。"}]}]</script>
<script>
'use strict';
const TOPICS=JSON.parse(document.getElementById('notes-data').textContent);
const KEY='mirror-writing-notes-v1';
const dimensions=['Task Response','Coherence and Cohesion','Lexical Resource','Grammatical Range and Accuracy'];
const stages=[['overview','題目與重點'],['original','原稿與評分'],['corrections','逐句訂正'],['logic','論證修改'],['final','最終範文']];
let state={mastered:{},rewrites:{},saved:{}};
let storageAvailable=true;
try{const old=JSON.parse(localStorage.getItem(KEY)||'null');if(old&&old.schema===1&&old.data)state=cleanState(old.data)}catch{storageAvailable=false}
let view='topics',topicId=TOPICS[0].id,stage='overview',version=1,filterCategory='',onlyPending=false,onlySaved=false,originalMode='marked',activePenNote=null;
const content=document.getElementById('content');
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const words=p=>p.trim()?p.trim().split(/\s+/).length:0;
const count=ps=>ps.reduce((n,p)=>n+words(p),0);
const topic=()=>TOPICS.find(t=>t.id===topicId)||TOPICS[0];
const ck=(t,c)=>t.id+':'+c.id;
const pk=(t,e)=>t.id+':'+e.id;
function cleanState(raw){const result={mastered:{},rewrites:{},saved:{}};for(const t of TOPICS){for(const c of t.corrections){const k=ck(t,c);if(raw.mastered?.[k]===true)result.mastered[k]=true;if(typeof raw.rewrites?.[k]==='string')result.rewrites[k]=raw.rewrites[k].slice(0,20000)}for(const e of t.expressions){const k=pk(t,e);if(raw.saved?.[k]===true)result.saved[k]=true}}return result}
function persist(){try{localStorage.setItem(KEY,JSON.stringify({schema:1,data:state}))}catch{storageAvailable=false;document.getElementById('storageNote').textContent='此瀏覽器無法儲存紀錄；目前內容仍可使用，離開前請匯出複習紀錄。'}}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.hidden=true,3200)}
function setRoute(nextView=view,nextStage=stage,id=topicId){view=nextView;stage=nextStage;topicId=id;const hash=view==='topics'?'topic/'+encodeURIComponent(topicId)+'/'+stage:view;history.pushState(null,'','#'+hash);render()}
function readRoute(){const h=location.hash.slice(1).split('/');if(['errors','phrases'].includes(h[0])){view=h[0];return}if(h[0]==='topic'){let id;try{id=decodeURIComponent(h[1]||'')}catch{return}if(TOPICS.some(t=>t.id===id))topicId=id;if(stages.some(s=>s[0]===h[2]))stage=h[2];view='topics'}}
function refreshNav(){document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-current',b.dataset.view===view?'page':'false'));document.getElementById('navTopics').textContent=String(TOPICS.length).padStart(2,'0');document.getElementById('navErrors').textContent=TOPICS.reduce((n,t)=>n+t.corrections.filter(c=>c.type==='修正').length,0);document.getElementById('navPhrases').textContent=TOPICS.reduce((n,t)=>n+t.expressions.length,0);document.getElementById('topicCount').textContent=String(TOPICS.length).padStart(2,'0');document.getElementById('updated').textContent='本題更新 '+topic().date+' · '+topic().id}
function render(){refreshNav();if(view==='topics')renderTopic();else if(view==='errors')renderErrors();else renderPhrases()}
function renderTopic(){const t=topic();content.innerHTML=`<section class="collection"><div class="section-head"><h2>寫作題庫</h2><span class="small muted">${TOPICS.length} 題 · Task 2</span></div><div class="topic-list">${TOPICS.map((x,i)=>`<button class="topic-card" data-topic="${esc(x.id)}" type="button"><span class="topic-index">${String(i+1).padStart(2,'0')}</span><span><h3>${esc(x.title)}</h3><p>${esc(x.task)} · ${esc(x.type)} · ${esc(x.date)}</p></span><span class="arrow" aria-hidden="true">↗</span></button>`).join('')}</div></section><article class="workbook" id="workbook"><span class="eyebrow">${esc(t.id)} / HEALTH & SOCIETY</span><header class="topic-heading"><div><h2>${esc(t.title)}</h2><span class="english-title">${esc(t.enTitle)}</span></div><div><span class="status-chip">已完成訂正</span><div class="tags" style="margin-top:10px">${t.tags.map(tag=>`<span class="tag">${esc(tag)}</span>`).join('')}</div></div></header><nav class="stages" aria-label="筆記內容">${stages.map(([id,title])=>`<button type="button" data-stage="${id}" aria-current="${stage===id}">${title}</button>`).join('')}</nav><div id="stageContent"></div></article>`;
content.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{setRoute('topics','overview',b.dataset.topic);scrollWorkbook()});content.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>setRoute('topics',b.dataset.stage));const el=document.getElementById('stageContent');if(stage==='overview')overview(el,t);if(stage==='original')original(el,t);if(stage==='corrections')corrections(el,t);if(stage==='logic')logic(el,t);if(stage==='final')finalEssay(el,t)}
function scrollWorkbook(){document.getElementById('workbook')?.scrollIntoView({block:'start',behavior:'smooth'})}
function overview(el,t){el.innerHTML=`<section class="section"><h3><span class="number">01</span>完整題目</h3><div class="prompt" lang="en"><p>${esc(t.prompt)}</p><p class="question">${esc(t.question)}</p><p class="small">${esc(t.instruction)}</p></div><p class="small muted" style="margin-top:10px">建議作答時間 40 分鐘 · 學術組 Writing Task 2</p></section><div class="grid2"><section class="summary-card"><h3>本題先練好這三件事</h3><ul>${t.originals[1].priorities.map(p=>`<li>${esc(p)}</li>`).join('')}</ul><button class="btn" style="margin-top:18px" data-go="corrections">開始逐句複習 →</button></section><section class="summary-card"><h3>我們的四步批改流程</h3><ol class="mini-flow"><li>原文電子化與字數統計</li><li>四大指標評分與原因分析</li><li>逐句最小訂正與中文解釋</li><li>整體改寫與可遷移表達</li></ol><p class="small muted" style="margin-top:12px">每一步確認後，再進入下一步。</p></section></div><div class="callout" style="margin-top:22px"><b>這題的核心判斷</b><br>健康替代品仍難以取得時，反對普遍漲價。先承認減糖的可能好處，再解釋負擔與替代行為。</div>`;el.querySelector('[data-go]').onclick=()=>setRoute('topics','corrections')}
function penEditsHTML(annotation){return annotation.edits.map(e=>{if(e.kind==='equal')return esc(e.before);return `<span class="pen-edit ${e.kind==='insert'?'insert-only':''}">${e.before?`<del aria-label="刪除：${esc(e.before)}">${esc(e.before)}</del>`:''}${e.after?`<ins aria-label="改為：${esc(e.after)}">${esc(e.after)}</ins>`:''}</span>`}).join('')}
function penParagraphHTML(annotations,p){return annotations.filter(a=>a.p===p).map(a=>{const changed=a.original!==a.fixed;return `<span class="pen-sentence">${penEditsHTML(a)}<button type="button" class="pen-note ${changed?'':'keep-note'}" data-pen-note="${esc(a.id)}" aria-label="第 ${a.number} 句${changed?'批改說明':'保留原因與可選建議'}" aria-pressed="${activePenNote===a.id}" lang="zh-Hant">${a.number}</button></span>`}).join(' ')}
function feedbackHTML(a){if(!a)return '<div class="pen-feedback empty-feedback">點選句末編號查看修改原因。紅字標示最小訂正；更自然的可選寫法與論證提醒，另外列在說明中。</div>';const changed=a.original!==a.fixed;return `<aside class="pen-feedback" id="penFeedback"><span class="pen-reference">SENTENCE ${a.number} / ${changed?'最小訂正':'文法可保留'}</span><h4>${esc(a.category)}</h4><ul>${a.why.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>${a.optional?`<p class="note"><b>可選優化（不代表原句錯誤）</b><br>${esc(a.optional)}</p>`:''}${a.logic?`<p class="note"><b>論證提醒</b><br>${esc(a.logic)}</p>`:''}${version===1?'<div class="tools"><button type="button" class="btn" id="penToCorrection">前往本句逐句訂正 →</button></div>':''}</aside>`}
function original(el,t){const v=t.originals[version];const annotations=v.annotations||[];const fixedParagraphs=v.paragraphs.map((_,i)=>annotations.filter(a=>a.p===i+1).map(a=>a.fixed).join(' '));el.innerHTML=`<div class="tools version-switch">${t.originals.map((x,i)=>`<button class="btn ${version===i?'active':''}" data-version="${i}" aria-pressed="${version===i}">${esc(x.name)}</button>`).join('')}<span class="count-label">原稿 ${count(v.paragraphs)} words${originalMode==='clean'?' · 訂正後 '+count(fixedParagraphs)+' words':''}</span></div><div class="tools manuscript-tools" aria-label="原稿顯示方式">${[['marked','紅筆批改'],['raw','只看原稿'],['clean','訂正後全文']].map(([mode,label])=>`<button type="button" class="btn ${originalMode===mode?'active':''}" data-original-mode="${mode}" aria-pressed="${originalMode===mode}">${label}</button>`).join('')}</div>${originalMode==='marked'?`<div class="pen-legend"><span><del>原本用字</del> 刪除或替換</span><span><ins>紅字</ins> 修正或補入</span><span>句末編號 → 修改說明</span></div><div class="pen-paper" aria-label="原稿紅筆批改版">${v.paragraphs.map((p,i)=>`<section class="pen-paragraph"><span class="paragraph-label">PARAGRAPH ${i+1} · 原稿 ${words(p)} WORDS</span><p class="pen-text" lang="en">${penParagraphHTML(annotations,i+1)}</p></section>`).join('')}</div>${feedbackHTML(annotations.find(a=>a.id===activePenNote))}`:originalMode==='raw'?`<div class="reading original" lang="en">${v.paragraphs.map((p,i)=>`<p><span class="paragraph-label">PARAGRAPH ${i+1} · ${words(p)} WORDS</span>${esc(p)}</p>`).join('')}</div>`:`<div class="reading clean-corrected" lang="en">${fixedParagraphs.map((p,i)=>`<p><span class="paragraph-label">PARAGRAPH ${i+1}</span>${esc(p)}</p>`).join('')}</div><p class="small muted" style="margin-top:12px">本區只整合第三步的語言訂正，仍保留原稿論點；不是最後的優化範文。可選風格建議不強制套用。</p>`}${version===1?'<p class="small muted" style="margin-top:12px">cotain 的照片辨識仍待核對；若原稿其實是 contain，這處不算拼字錯誤。第一句涉及主詞與指代，依第三步建議做必要重組。</p>':''}<hr class="divider"><h3>四項評分與原因</h3><div class="score-banner"><strong>${esc(v.score)}</strong><p>${esc(v.name)} · Task 2 原稿教學估分<br>此分數針對未訂正原稿，不是紅字訂正後全文的分數。</p></div><div class="table-wrap"><table><thead><tr><th>評分指標</th><th>估分</th><th>依據與限制</th></tr></thead><tbody>${dimensions.map((d,i)=>`<tr><td lang="en">${d}</td><td class="score">${v.scores[i].toFixed(1)}</td><td>${esc(v.notes[i])}</td></tr>`).join('')}</tbody></table></div><p class="small muted" style="margin-top:14px">${version===1?'與第一稿相比，組織與推論有進步；第一稿文法估分偏寬鬆，請勿把兩次文法數字直接視為進退步。':'保留當時的評分紀錄；後續複核認為文法估分偏寬鬆。'}</p><p class="small"><a href="https://ielts.org/cdn/ielts-guides/ielts-writing-band-descriptors.pdf" target="_blank" rel="noopener noreferrer">IELTS 官方 Writing Band Descriptors ↗</a></p>`;el.querySelectorAll('[data-version]').forEach(b=>b.onclick=()=>{version=Number(b.dataset.version);activePenNote=null;original(el,t)});el.querySelectorAll('[data-original-mode]').forEach(b=>b.onclick=()=>{originalMode=b.dataset.originalMode;original(el,t)});el.querySelectorAll('[data-pen-note]').forEach(b=>b.onclick=()=>{activePenNote=activePenNote===b.dataset.penNote?null:b.dataset.penNote;original(el,t);if(activePenNote)document.getElementById('penFeedback')?.scrollIntoView({block:'nearest',behavior:'smooth'})});const jump=el.querySelector('#penToCorrection');if(jump)jump.onclick=()=>{const id=activePenNote;filterCategory='';onlyPending=false;setRoute('topics','corrections');const card=document.getElementById(id);card?.querySelector('details')?.setAttribute('open','');card?.scrollIntoView({block:'center',behavior:'smooth'})}}
function progressHTML(items){const done=items.filter(({t,c})=>state.mastered[ck(t,c)]).length;return `<div class="progress-row"><span>${done} / ${items.length} 項已掌握</span><div class="progress-track"><div class="progress-fill" style="width:${items.length?100*done/items.length:0}%"></div></div><span>以能自行訂正為準</span></div>`}
function filterHTML(items,includeKeep=false){const cats=[...new Set(items.map(x=>x.c.category))];return `<div class="filter-row"><label class="small">分類 <select id="category"><option value="">全部分類</option>${cats.map(c=>`<option ${filterCategory===c?'selected':''} value="${esc(c)}">${esc(c)}</option>`).join('')}</select></label><label class="check-label"><input type="checkbox" id="pending" ${onlyPending?'checked':''}>只看待複習</label><button class="btn" id="expandAll">顯示全部訂正</button><button class="btn" id="collapseAll">隱藏全部訂正</button></div>`}
function cardHTML(t,c){const key=ck(t,c);return `<section class="correction" id="${esc(c.id)}"><div class="correction-head"><span class="label">P${c.p} · 第 ${Number(c.id.slice(1))} 句 <span class="pill ${c.type==='保留'?'keep':''}">${c.type==='保留'?'可保留':esc(c.category)}</span></span><label class="check-label"><input type="checkbox" data-master="${esc(key)}" ${state.mastered[key]?'checked':''}>已掌握</label></div><div class="correction-body"><span class="eyebrow">MY ORIGINAL SENTENCE</span><p class="source-sentence" lang="en">${esc(c.original)}</p><details class="answer-details"><summary>查看${c.type==='保留'?'保留原因與可選優化':'最小訂正與解釋'}</summary><div class="fixed-sentence" lang="en">${esc(c.fixed)}</div><div class="explanation"><ul>${c.why.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>${c.optional?`<p class="note"><b>可選優化</b>　${esc(c.optional)}</p>`:''}${c.logic?`<div class="logic-note"><b>論證提醒</b>　${esc(c.logic)}</div>`:''}</div></details><label class="rewrite-label" for="rewrite-${esc(c.id)}">先自己重寫一次 <span class="save-indicator"></span></label><textarea id="rewrite-${esc(c.id)}" class="rewrite" data-rewrite="${esc(key)}" placeholder="不看答案，你會怎麼修改這一句？" lang="en" spellcheck="false">${esc(state.rewrites[key]||'')}</textarea></div></section>`}
function mountCorrections(el,items,header=''){const visible=items.filter(({t,c})=>(!filterCategory||c.category===filterCategory)&&(!onlyPending||!state.mastered[ck(t,c)]));el.innerHTML=header+progressHTML(items)+filterHTML(items)+`<div class="count-label" style="margin-bottom:12px">顯示 ${visible.length} 項</div><div id="correctionCards">${visible.length?visible.map(({t,c})=>cardHTML(t,c)).join(''):'<div class="empty">目前沒有符合條件的項目。可切換分類或取消「只看待複習」。</div>'}</div>`;el.querySelector('#category').onchange=e=>{filterCategory=e.target.value;mountCorrections(el,items,header)};el.querySelector('#pending').onchange=e=>{onlyPending=e.target.checked;mountCorrections(el,items,header)};el.querySelector('#expandAll').onclick=()=>el.querySelectorAll('.answer-details').forEach(d=>d.open=true);el.querySelector('#collapseAll').onclick=()=>el.querySelectorAll('.answer-details').forEach(d=>d.open=false);el.querySelectorAll('[data-master]').forEach(b=>b.onchange=()=>{state.mastered[b.dataset.master]=b.checked;persist();mountCorrections(el,items,header)});el.querySelectorAll('[data-rewrite]').forEach(b=>b.oninput=()=>{state.rewrites[b.dataset.rewrite]=b.value;persist();b.parentElement.querySelector('.save-indicator').textContent=storageAvailable?'· 已儲存於此瀏覽器':'· 尚未持久儲存'})}
function corrections(el,t){mountCorrections(el,t.corrections.map(c=>({t,c})),`<p class="small muted">保留第二稿的 14 句。先自行訂正，再展開解釋；「可保留」代表文法成立，不會為改而改。</p>`)}
function logic(el,t){el.innerHTML=`<p class="small muted">記錄改寫背後的判斷，避免只背最後的句子。</p>${t.logic.map((l,i)=>`<section class="logic-card"><h3><span class="number">${String(i+1).padStart(2,'0')}</span>${esc(l.title)}</h3><div class="compare"><div><span class="caption">原本的限制</span>${esc(l.before)}</div><div><span class="caption">最後的處理</span>${esc(l.after)}</div></div><p class="lesson">帶到下一題 → ${esc(l.lesson)}</p></section>`).join('')}<button class="btn primary" id="toFinal">對照最終範文 →</button>`;el.querySelector('#toFinal').onclick=()=>setRoute('topics','final')}
function finalEssay(el,t){const n=count(t.final);el.innerHTML=`<header class="essay-heading"><div><span class="eyebrow">FINAL STUDY VERSION</span><h3 style="margin:7px 0">最終確認範文</h3><span class="small muted">${esc(t.date)} · 保留討論後的最後版本</span></div><div class="word-stat">${n} <span>words</span></div></header><div class="tools" style="margin-bottom:21px"><button class="btn primary" id="copyEssay">複製全文</button><button class="btn" id="toggleLabels" aria-pressed="false">顯示段落功能</button></div><div class="reading essay" lang="en">${t.final.map((p,i)=>`<p><span class="paragraph-label essay-label" hidden>${['INTRODUCTION · 引入政策與立場','BODY 1 · 負擔與可行替代品','BODY 2 · 替代行為與有限收益','CONCLUSION · 重申條件與優先方案'][i]} · ${words(p)} WORDS</span>${esc(p)}</p>`).join('')}</div><div class="essay-note"><ul>${t.finalNotes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul><p>計字方式：連字號單字（如 low-sugar）、縮寫與所有格各計一字，題目不計入。</p></div>`;el.querySelector('#copyEssay').onclick=()=>copy(t.final.join('\n\n'));el.querySelector('#toggleLabels').onclick=e=>{const on=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',String(on));e.currentTarget.textContent=on?'隱藏段落功能':'顯示段落功能';el.querySelectorAll('.essay-label').forEach(l=>l.hidden=!on)}}
async function copy(text){try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text)}else{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.append(ta);ta.select();const ok=document.execCommand('copy');ta.remove();if(!ok)throw Error('copy')}toast('已複製範文全文')}catch{toast('無法自動複製，請選取文章文字後複製。')}}
function renderErrors(){const items=TOPICS.flatMap(t=>t.corrections.filter(c=>c.type==='修正').map(c=>({t,c})));content.innerHTML=`<section class="library-head"><span class="eyebrow">MY ERROR LOG</span><h2>把反覆出現的問題練熟。</h2><p>跨題收錄必要修正；論證問題另外保留在各題的「論證修改」。</p></section><div class="workbook" id="errorBody"></div>`;mountCorrections(document.getElementById('errorBody'),items)}
function expressionHTML(t,e){const key=pk(t,e);return `<section class="expression"><label class="check-label saved-toggle"><input type="checkbox" data-save="${esc(key)}" ${state.saved[key]?'checked':''}>收藏</label><span class="eyebrow">${esc(e.use)}</span><h3 lang="en">${esc(e.phrase)}</h3><p class="meaning">${esc(e.meaning)}</p><p class="example-line" lang="en">${esc(e.source)}</p><p class="related">來源：${esc(t.title)} · ${esc(t.id)}</p><details><summary>查看跨題例句與使用提醒</summary><p class="example" lang="en" style="margin-top:12px">${esc(e.example)}</p><p class="small muted">${esc(e.tip)}</p></details></section>`}
function renderPhrases(){const all=TOPICS.flatMap(t=>t.expressions.map(e=>({t,e})));const items=all.filter(({t,e})=>!onlySaved||state.saved[pk(t,e)]);content.innerHTML=`<section class="library-head"><span class="eyebrow">EXPRESSIONS TO REUSE</span><h2>學會一種表達，帶到下一題。</h2><p>從範文回到上下文，再練習跨主題使用，不孤立背誦句型。</p></section><div class="filter-row"><label class="check-label"><input id="onlySaved" type="checkbox" ${onlySaved?'checked':''}>只看收藏</label><span class="count-label">${items.length} / ${all.length} 個表達</span></div><article class="workbook">${items.length?items.map(({t,e})=>expressionHTML(t,e)).join(''):'<div class="empty">還沒有收藏。取消篩選後，勾選想再練習的表達。</div>'}</article>`;content.querySelector('#onlySaved').onchange=e=>{onlySaved=e.target.checked;renderPhrases()};content.querySelectorAll('[data-save]').forEach(b=>b.onchange=()=>{state.saved[b.dataset.save]=b.checked;persist();if(onlySaved)renderPhrases()})}
function search(query){const q=query.trim().toLowerCase(),el=document.getElementById('searchResults');if(!q){el.hidden=true;el.innerHTML='';return}const results=[];for(const t of TOPICS){if([t.title,t.enTitle,t.prompt,t.question,t.tags.join(' ')].join(' ').toLowerCase().includes(q))results.push({title:t.title,detail:'完整題目與學習重點',view:'topics',stage:'overview',topic:t.id});for(const v of t.originals){if(v.paragraphs.join(' ').toLowerCase().includes(q))results.push({title:t.title+' · '+v.name,detail:'原稿與四項評分',view:'topics',stage:'original',topic:t.id,version:t.originals.indexOf(v)})}for(const c of t.corrections){if([c.original,c.fixed,c.category,...c.why,c.optional,c.logic].join(' ').toLowerCase().includes(q))results.push({title:c.category+' · 第 '+Number(c.id.slice(1))+' 句',detail:c.original,view:'topics',stage:'corrections',topic:t.id,anchor:c.id})}for(const l of t.logic){if(Object.values(l).join(' ').toLowerCase().includes(q))results.push({title:l.title,detail:l.lesson,view:'topics',stage:'logic',topic:t.id})}for(const e of t.expressions){if(Object.values(e).join(' ').toLowerCase().includes(q))results.push({title:e.phrase,detail:e.meaning,view:'phrases',topic:t.id})}if(t.final.join(' ').toLowerCase().includes(q))results.push({title:t.title+' · 最終範文',detail:count(t.final)+' words',view:'topics',stage:'final',topic:t.id})}el.hidden=false;el.innerHTML=`<p class="small muted" role="status">${results.length} 個搜尋結果</p>`+(results.length?results.map((r,i)=>`<button class="search-result" data-result="${i}"><b>${esc(r.title)}</b><span>${esc(r.detail.slice(0,125))}${r.detail.length>125?'…':''}</span></button>`).join(''):'<div class="empty">找不到符合的內容。試試「被動語態」、「suggest」或「健康」。</div>');el.querySelectorAll('[data-result]').forEach(b=>b.onclick=()=>{const r=results[Number(b.dataset.result)];filterCategory='';onlyPending=false;onlySaved=false;if(r.version!==undefined)version=r.version;setRoute(r.view,r.stage||'overview',r.topic);document.getElementById('search').value='';el.hidden=true;if(r.anchor){const card=document.getElementById(r.anchor);card?.querySelector('details')?.setAttribute('open','');card?.classList.add('highlight');card?.scrollIntoView({block:'center',behavior:'smooth'})}else if(r.view==='topics')scrollWorkbook();else content.scrollIntoView({block:'start',behavior:'smooth'})})}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{filterCategory='';onlyPending=false;setRoute(b.dataset.view)});
document.getElementById('search').oninput=e=>search(e.target.value);
document.getElementById('clearSearch').onclick=()=>{document.getElementById('search').value='';search('');document.getElementById('search').focus()};
document.getElementById('exportProgress').onclick=()=>{const blob=new Blob([JSON.stringify({schema:1,exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='ielts-writing-review-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已匯出重寫、掌握標記與收藏')};
document.getElementById('importProgress').onclick=()=>document.getElementById('importFile').click();
document.getElementById('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>2000000)throw Error('size');const obj=JSON.parse(await f.text());if(obj.schema!==1||!obj.data||typeof obj.data!=='object')throw Error('schema');const next=cleanState(obj.data);if(!confirm('匯入會取代目前瀏覽器的重寫、收藏與掌握標記。確定匯入？'))return;state=next;persist();render();toast('已匯入複習紀錄')}catch{toast('檔案無法匯入，請選擇本站匯出的 JSON 紀錄。')}finally{e.target.value=''}};
document.getElementById('print').onclick=()=>window.print();
window.addEventListener('hashchange',()=>{readRoute();render()});
window.addEventListener('popstate',()=>{readRoute();render()});
if(!storageAvailable)document.getElementById('storageNote').textContent='此瀏覽器無法讀取儲存紀錄；離開前可匯出目前複習紀錄。';
readRoute();render();
</script>
</body></html>
